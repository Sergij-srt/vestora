name: Vestora Multiplatform CI/CD (Web PWA, Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Build & Deploy Web PWA to GitHub Pages
  build-and-deploy-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests & Verification
        run: |
          flutter analyze
          flutter test

      - name: Build Web PWA (CanvasKit & WASM optimized)
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Prepare SPA Fallback for GitHub Pages
        run: |
          cp web/404.html build/web/404.html

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_app/build/web

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 2: Build Android APK & App Bundle (AAB for Google Play)
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Configure Android Keystore from Secrets
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/vestora-release-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=vestora-release-keystore.jks
          EOF

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Build Android App Bundle (Google Play AAB)
        run: flutter build appbundle --release

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vestora-android-release
          path: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/bundle/release/app-release.aab

  # Job 3: Build iOS (Runs on macOS runner in GitHub Actions)
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS No-Codesign (Ready for TestFlight signing)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Payload
        uses: actions/upload-artifact@v4
        with:
          name: vestora-ios-release-payload
          path: mobile_app/build/ios/iphoneos
